services:
    swarmui:
        image: ghcr.io/rzyns/docker-swarmui:development
        build:
            context: .
            # dockerfile: launchtools/StandardDockerfile.docker
            dockerfile: ./Dockerfile
        container_name: swarmui
        init: true
        # uncomment `network_mode: host` if you want to access other services on the host network (eg a separated comfy instance)
        # network_mode: host
        environment:
            ARIA2C_SECRET: "secret"
            SWARM_ARGS: "--loglevel=DEBUG"
        volumes:
            # - ./swarmui/Data:/SwarmUI/Data
            #
            # - ./swarmui/Data:/workspace/Data
            # - ./swarmui/models/:/workspace/models
            # - ./swarmui/output/:/workspace/output
            # - ./swarmui/aria/:/workspace/aria/

            - ./swarmui:/workspace/
        ports:
            - "7801:7801"
            - 7821
            - 6800
        deploy: &deploy
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          # change the count to the number of GPUs you want to use.
                          count: 1
                          capabilities: [gpu]

    swarmui-backend:
        image: ghcr.io/rzyns/docker-swarmui:development
        build:
            context: .
            # dockerfile: launchtools/StandardDockerfile.docker
            dockerfile: ./Dockerfile
        container_name: swarmui-backend
        init: true
        # uncomment `network_mode: host` if you want to access other services on the host network (eg a separated comfy instance)
        # network_mode: host
        environment:
            ARIA2C_SECRET: "secret"
            SWARM_ARGS: "--loglevel=DEBUG"
        volumes:
            # - ./swarmui-backend/Data:/SwarmUI/Data
            # - ./swarmui-backend/models/:/workspace/models
            # - ./swarmui-backend/output/:/workspace/output
            # - ./swarmui-backend/aria/:/workspace/aria/

            - ./swarmui-backend:/workspace/
        ports: [ "7802:7801", 7821, 6800, ]
        deploy: *deploy

volumes: {}
